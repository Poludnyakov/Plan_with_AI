<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>планиИруй! — календарь</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--text:#172033;--muted:#6f7787;--line:#e6e9ef;--primary:#3478f6;--primaryText:#fff;--event:#dbeafe;--eventText:#174580;--danger:#c4322b;--hour:60px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}.brand b{display:block;font-size:18px}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:12px;text-transform:capitalize}.today{border:0;border-radius:12px;padding:10px 13px;background:#edf3ff;color:var(--primary);font-weight:750}.week-viewport{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--surface);touch-action:pan-x;overscroll-behavior-x:contain}.week-viewport::-webkit-scrollbar{display:none}.week-page{flex:0 0 100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:7px 8px 9px;scroll-snap-align:center}.day{height:56px;border:0;border-radius:14px;background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.day-name{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}.day-number{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:750}.day.today-day .day-number{color:var(--primary)}.day.selected .day-number{background:var(--primary);color:#fff}.day.has-events:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--primary)}.content{min-height:0;position:relative}.timeline-scroll,.agenda{height:100%;overflow-y:auto;background:var(--surface);overscroll-behavior:contain}.timeline{position:relative;height:calc(var(--hour)*24);min-height:calc(var(--hour)*24)}.hour{position:absolute;left:0;right:0;height:var(--hour);border-top:1px solid var(--line);pointer-events:none}.hour span{position:absolute;top:-7px;left:5px;width:42px;padding-right:5px;background:var(--surface);color:var(--muted);font-size:10px;text-align:right}.events{position:absolute;left:53px;right:8px;top:0;height:100%}.event{position:absolute;min-height:22px;border:0;border-left:4px solid var(--primary);border-radius:8px;background:var(--event);color:var(--eventText);padding:7px 9px;overflow:hidden;text-align:left;touch-action:none;user-select:none;box-shadow:0 1px 2px #1d4ed81a}.event.done{opacity:.65;border-color:#24935c;background:#e2f5e9;color:#17603e}.event.dragging{z-index:20;opacity:.88;box-shadow:0 8px 24px #1d4ed833}.event-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}.event-time{display:block;margin-top:2px;font-size:10px;font-variant-numeric:tabular-nums}.resize{position:absolute;left:6px;right:6px;height:12px;cursor:ns-resize}.resize.top{top:-2px}.resize.bottom{bottom:-2px}.resize:after{content:"";position:absolute;left:50%;top:5px;width:28px;height:3px;transform:translateX(-50%);border-radius:9px;background:#3478f680;opacity:0}.event:active .resize:after,.event:hover .resize:after{opacity:1}.now{position:absolute;left:46px;right:0;height:2px;background:#ef4444;z-index:4;pointer-events:none}.now:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ef4444}.empty{position:sticky;top:18px;width:max-content;max-width:calc(100% - 80px);margin:18px 15px 0 auto;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--muted);font-size:12px}.agenda{padding:8px 12px 90px}.agenda-date{margin:15px 4px 6px;color:var(--muted);font-size:11px;text-transform:uppercase}.agenda-card{width:100%;display:grid;grid-template-columns:80px 4px 1fr;gap:10px;padding:12px 8px;border:0;border-radius:12px;background:transparent;color:v
@media(min-width:760px){.app{width:min(1000px,100%);margin:auto;border-inline:1px solid var(--line)}.fab{right:max(28px,calc((100vw - 1000px)/2 + 28px))}.backdrop{align-items:center;justify-content:center;padding:24px}.sheet{max-width:520px;border-radius:24px;padding:16px 24px 24px}.resize:after{opacity:.75}}
@media(prefers-color-scheme:dark){:root{--bg:#11141a;--surface:#191d25;--text:#eef1f6;--muted:#a8afbd;--line:#303641;--event:#173257;--eventText:#d9e9ff}.sheet{background:#20242c;color:#eef1f6}.field input,.field textarea{background:#292e38;border-color:#495160;color:#fff}.details-desc{color:#eef1f6}.close,.action.secondary{background:#323843;color:#fff}}
</style>
</head>
<body>
<div class="app">
 <header class="top"><div class="brand"><b>планиИруй!</b><span id="dateLabel"></span></div><button class="today" id="today">Сегодня</button></header>
 <div class="week-viewport" id="weeks" aria-label="Листайте недели"></div>
 <main class="content"><div class="timeline-scroll" id="timelineScroll"><div class="timeline" id="timeline"></div></div><div class="agenda" id="agenda" hidden></div></main>
 <nav class="bottom"><button class="nav active" data-view="timeline"><span>▥</span>День</button><button class="nav" data-view="agenda"><span>≡</span>Расписание</button></nav>
</div>
<button class="fab" id="add" aria-label="Добавить">+</button>
<div class="backdrop" id="createBackdrop"><section class="sheet"><div class="handle"></div><div class="sheet-head"><h2>Новое мероприятие</h2><button class="close" data-close="createBackdrop">×</button></div><form id="createForm"><div class="field"><label>Название</label><input id="title" maxlength="255" required placeholder="Контрольная по физике"></div><div class="field"><label>Начало</label><input id="start-at" type="datetime-local" required></div><div class="field"><label>Окончание</label><input id="end-at" type="datetime-local" required></div><div class="field"><label>Описание</label><textarea id="description" placeholder="Аудитория и детали"></textarea></div><p class="error" id="createError"></p><div class="actions"><button type="button" class="action secondary" data-close="createBackdrop">Отмена</button><button class="action primary" id="save">Сохранить</button></div></form></section></div>
<div class="backdrop" id="detailsBackdrop"><section class="sheet"><div class="handle"></div><div class="sheet-head"><h2 id="detailsTitle"></h2><button class="close" data-close="detailsBackdrop">×</button></div><div class="details-time" id="detailsTime"></div><div class="details-desc" id="detailsDescription"></div><p class="error" id="detailsError"></p><div class="actions"><button class="action danger" id="delete">Удалить</button><button class="action primary" id="complete">Выполнено</button></div></section></div>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const CONFIG={{ calendar_config | default({'apiBase':'/api/v2/events','reauthUrl':'/miniapp?destination=calendar','tokenKey':'planiruy_access_token','platform':'telegram'}) | tojson }};
const HOUR=60,SNAP=15,MIN_DURATION=15,$=id=>document.getElementById(id);
const state={selected:startDay(new Date()),events:[],active:null,view:new URLSearchParams(location.search).get('view')==='agenda'?'agenda':'timeline',centering:false};
const dayFmt=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}),shortFmt=new Intl.DateTimeFormat('ru-RU',{weekday:'short'}),timeFmt=new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'});
function startDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function dayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function sameDay(a,b){return dayKey(a)===dayKey(b)}function monday(d){const x=startDay(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function plusDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function evStart(e){return new Date(e.start)}function evEnd(e){return new Date(e.end)}function minute(d){return d.getHours()*60+d.getMinutes()}function cap(s){return s?s[0].toUpperCase()+s.slice(1):''}function inputDate(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function isoAt(day,mins){const d=startDay(day);d.setMinutes(mins);return d}
function renderWeeks(){const box=$('weeks');box.replaceChildren();const base=monday(state.selected),today=startDay(new Date());[-7,0,7].forEach(offset=>{const page=document.createElement('div');page.className='week-page';for(let i=0;i<7;i++){const date=plusDays(base,offset+i),b=document.createElement('button');b.type='button';b.className='day';if(sameDay(date,today))b.classList.add('today-day');if(sameDay(date,state.selected))b.classList.add('selected');if(state.events.some(e=>sameDay(evStart(e),date)))b.classList.add('has-events');b.innerHTML=`<span class="day-name">${shortFmt.format(date).replace('.','')}</span><span class="day-number">${date.getDate()}</span>`;b.onclick=()=>{state.selected=startDay(date);render();scrollRelevant()};page.append(b)}box.append(page)});$('dateLabel').textContent=cap(dayFmt.format(state.selected));requestAnimationFrame(()=>{state.centering=true;box.scrollLeft=box.clientWidth;requestAnimationFrame(()=>state.centering=false)})}
let weekTimer;$('weeks').addEventListener('scroll',()=>{if(state.centering)return;clearTimeout(weekTimer);weekTimer=setTimeout(()=>{const box=$('weeks'),page=Math.round(box.scrollLeft/Math.max(1,box.clientWidth));if(page===1)return;state.selected=plusDays(state.selected,page===0?-7:7);render();scrollRelevant()},100)});
function selectedEvents(){return state.events.filter(e=>sameDay(evStart(e),state.selected)).sort((a,b)=>evStart(a)-evStart(b))}function columns(events){const active=[];events.forEach(e=>{for(let i=active.length-1;i>=0;i--)if(evEnd(active[i].event)<=evStart(e))active.splice(i,1);const used=new Set(active.map(x=>x.col));let col=0;while(used.has(col))col++;e._col=col;active.push({event:e,col});e._cols=Math.max(1,active.length)});const max=Math.max(1,...events.map(e=>e._cols));events.forEach(e=>e._cols=max);return events}
function geometry(node,start,end){const top=Math.max(0,minute(start)/60*HOUR),duration=Math.max(MIN_DURATION,(end-start)/60000);node.style.top=`${top}px`;node.style.height=`${Math.max(22,duration/60*HOUR-2)}px`;node.querySelector('.event-time').textContent=`${timeFmt.format(start)}–${timeFmt.format(end)}`}
function eventNode(event){const node=document.createElement('div');node.className='event'+(event.is_completed?' done':'');node.style.left=`calc(${event._col/event._cols*100}% + 2px)`;node.style.width=`calc(${100/event._cols}% - 4px)`;node.innerHTML=`<i class="resize top" data-mode="start"></i><span class="event-title"></span><span class="event-time"></span><i class="resize bottom" data-mode="end"></i>`;node.querySelector('.event-title').textContent=event.title;geometry(node,evStart(event),evEnd(event));bindDrag(node,event);node.onclick=()=>{if(!node.dataset.dragged)openDetails(event);delete node.dataset.dragged};return node}
function bindDrag(node,event){node.addEventListener('pointerdown',down=>{if(down.button!==undefined&&down.button!==0)return;const mode=down.target.dataset.mode||'move',y=down.clientY,originalStart=evStart(event),originalEnd=evEnd(event);let start=new Date(originalStart),end=new Date(originalEnd),moved=false;node.setPointerCapture(down.pointerId);node.classList.add('dragging');const move=motion=>{const delta=Math.round(((motion.clientY-y)/HOUR*60)/SNAP)*SNAP;if(Math.abs(motion.clientY-y)>4)moved=true;if(mode==='move'){const duration=(originalEnd-originalStart)/60000;let next=minute(originalStart)+delta;next=Math.max(0,Math.min(1440-duration,next));start=isoAt(state.selected,next);end=isoAt(state.selected,next+duration)}else if(mode==='start'){start=isoAt(state.selected,Math.max(0,Math.min(minute(originalEnd)-MIN_DURATION,minute(originalStart)+delta)))}else{end=isoAt(state.selected,Math.min(1440,Math.max(minute(originalStart)+MIN_DURATION,minute(originalEnd)+delta)))}geometry(node,start,end)};const up=async()=>{node.removeEventListener('pointermove',move);node.classList.remove('dragging');if(!moved)return;node.dataset.dragged='1';try{await api(`${CONFIG.apiBase}/${encodeURIComponent(event.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({start_at:start.toISOString(),end_at:end.toISOString()})});event.start=start.toISOString();event.end=end.toISOString();toast('Время обновлено');await load()}catch(error){geometry(node,originalStart,originalEnd);toast(error.message)}};node.addEventListener('pointermove',move);node.addEventListener('pointerup',up,{once:true});node.addEventListener('pointercancel',up,{once:true});down.preventDefault()})}
function renderTimeline(){const root=$('timeline');root.replaceChildren();for(let h=0;h<24;h++){const row=document.createElement('div');row.className='hour';row.style.top=`${h*HOUR}px`;row.innerHTML=`<span>${String(h).padStart(2,'0')}:00</span>`;root.append(row)}const layer=document.createElement('div');layer.className='events';const events=columns(selectedEvents());events.forEach(e=>layer.append(eventNode(e)));root.append(layer);if(sameDay(state.selected,new Date())){const now=document.createElement('div');now.className='now';now.style.top=`${minute(new Date())/60*HOUR}px`;root.append(now)}if(!events.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='На этот день ничего не запланировано';root.append(empty)}}
function renderAgenda(){const root=$('agenda');root.replaceChildren();let previous='';[...state.events].sort((a,b)=>evStart(a)-evStart(b)).forEach(e=>{const key=dayKey(evStart(e));if(key!==previous){const h=document.createElement('h3');h.className='agenda-date';h.textContent=cap(dayFmt.format(evStart(e)));root.append(h);previous=key}const b=document.createElement('button');b.className='agenda-card';b.innerHTML='<span class="agenda-time"></span><span class="agenda-mark"></span><span><b class="agenda-title"></b><div class="agenda-desc"></div></span>';b.querySelector('.agenda-time').textContent=`${timeFmt.format(evStart(e))}\n${timeFmt.format(evEnd(e))}`;b.querySelector('.agenda-title').textContent=e.title;b.querySelector('.agenda-desc').textContent=e.description||'';b.onclick=()=>openDetails(e);root.append(b)});if(!state.events.length){const p=document.createElement('p');p.className='empty';p.textContent='Расписание пока пустое';root.append(p)}}
function render(){renderWeeks();renderTimeline();renderAgenda();const timeline=state.view==='timeline';$('timelineScroll').hidden=!timeline;$('agenda').hidden=timeline;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view))}function scrollRelevant(){if(state.view!=='timeline')return;const events=selectedEvents(),now=new Date(),mins=sameDay(state.selected,now)?minute(now):(events.length?minute(evStart(events[0])):8*60);requestAnimationFrame(()=>$('timelineScroll').scrollTop=Math.max(0,mins/60*HOUR-150))}
function options(opts={}){const headers={...(opts.headers||{})};try{if(CONFIG.tokenKey){const token=sessionStorage.getItem(CONFIG.tokenKey);if(token)headers.Authorization=`Bearer ${token}`}}catch(_){}return{...opts,headers,credentials:'include'}}async function authenticatedFetch(url,opts={}){return fetch(url,options(opts))}async function api(url,opts={}){const response=await authenticatedFetch(url,opts);if(response.status===401){location.replace(CONFIG.reauthUrl);throw new Error('Нужно войти снова')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'Не удалось выполнить действие');return data}async function load(){try{state.events=await api(CONFIG.apiBase);render();scrollRelevant()}catch(e){toast(e.message)}}
function openCreate(){const start=new Date(state.selected),now=new Date();if(sameDay(start,now))start.setHours(now.getHours()+1,0,0,0);else start.setHours(9,0,0,0);const end=new Date(start.getTime()+3600000);$('title').value='';$('description').value='';$('start-at').value=inputDate(start);$('end-at').value=inputDate(end);$('createError').style.display='none';$('createBackdrop').classList.add('open')}function close(id){$(id).classList.remove('open')}function openDetails(e){state.active=e;$('detailsTitle').textContent=e.title;$('detailsTime').textContent=`${cap(dayFmt.format(evStart(e)))} · ${timeFmt.format(evStart(e))}–${timeFmt.format(evEnd(e))}`;$('detailsDescription').textContent=e.description||'Без описания';$('complete').textContent=e.is_completed?'Вернуть в работу':'Выполнено';$('detailsError').style.display='none';$('detailsBackdrop').classList.add('open')}
$('createForm').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;const error=$('createError');error.style.display='none';try{const start=new Date($('start-at').value),end=new Date($('end-at').value);await api(CONFIG.apiBase,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value.trim(),description:$('description').value.trim(),start_at:start.toISOString(),end_at:end.toISOString()})});state.selected=startDay(start);close('createBackdrop');await load();toast('Мероприятие добавлено')}catch(x){error.textContent=x.message;error.style.display='block'}finally{$('save').disabled=false}};$('complete').onclick=async()=>{if(!state.active)return;try{await api(`${CONFIG.apiBase}/${encodeURIComponent(state.active.id)}/toggle-complete`,{method:'POST'});close('detailsBackdrop');await load();toast('Статус обновлён')}catch(e){showDetailsError(e.message)}};$('delete').onclick=async()=>{if(!state.active||!confirm(`Удалить «${state.active.title}»?`))return;try{await api(`${CONFIG.apiBase}/${encodeURIComponent(state.active.id)}`,{method:'DELETE'});close('detailsBackdrop');await load();toast('Мероприятие удалено')}catch(e){showDetailsError(e.message)}};function showDetailsError(s){$('detailsError').textContent=s;$('detailsError').style.display='block'}function toast(s){const n=$('toast');n.textContent=s;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),2600)}
$('today').onclick=()=>{state.selected=startDay(new Date());state.view='timeline';render();scrollRelevant()};$('add').onclick=openCreate;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.backdrop').forEach(b=>b.onclick=e=>{if(e.target===b)close(b.id)});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();scrollRelevant()});render();load();
})();
</script>
</body></html>
