<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>планиИруй! — Вход в личный кабинет</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #FCFCFD;
            --bg-panel: #FFFFFF;
            --border-color: #E5E5E5;
            --text-primary: #1A1A1A;
            --text-secondary: #5F6368;
            --yandex-red: #FC3F1D;
            --yandex-red-hover: #E33516;
            --transition-speed: 0.2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.05), 0 1px 3px 1px rgba(60, 64, 67, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            margin-bottom: 24px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.8px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        
        .logo-text i {
            color: var(--yandex-red);
            font-size: 30px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .widget-container {
            display: flex;
            justify-content: center;
            margin-bottom: 0;
        }
        .messenger-button {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 158, 217, .18);
            transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
        }
        .messenger-button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(34, 158, 217, .24); }
        .messenger-button:active { transform: translateY(0); }
        .messenger-button:disabled { opacity: .6; cursor: wait; transform: none; }
        .telegram-button { background: linear-gradient(135deg, #2aabee, #229ed9); }
        .max-button { background: linear-gradient(135deg, #8b54f6, #6940db); box-shadow: 0 8px 20px rgba(105,64,219,.18); }
        .messenger-icon { width: 22px; height: 22px; flex: 0 0 auto; fill: currentColor; }
        .login-divider { display:flex; align-items:center; gap:12px; margin:18px 0; color:#9aa0a6; font-size:12px; }
        .login-divider::before,.login-divider::after { content:""; height:1px; flex:1; background:var(--border-color); }
        .login-flow { display:none; margin-top:14px; padding:13px; border-radius:12px; background:#f5f3ff; color:#3b2b68; font-size:13px; line-height:1.5; }
        .login-flow.telegram-flow { background:#eef8fd; color:#20536d; }
        .login-flow a { display:inline-block; margin-top:8px; color:#6530cf; font-weight:700; }
        .login-flow.telegram-flow a { color:#167daf; }
        .login-code { display:block; margin-top:6px; font:700 15px ui-monospace,monospace; letter-spacing:.4px; overflow-wrap:anywhere; }

        .footer-text {
            font-size: 12px;
            color: #9AA0A6;
            margin-top: 16px;
        }

        .footer-text a {
            color: var(--yandex-red);
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <span class="logo-text">
                <i class="bi bi-clock-fill"></i>планиИруй!
            </span>
        </div>
        
        <h1>Вход в личный кабинет</h1>
        <p>Подключите ваш Telegram, чтобы автоматически синхронизировать учебное расписание, дедлайны и настроить мгновенные уведомления о задачах.</p>
        
        <div class="widget-container">
            <button class="messenger-button telegram-button" id="telegram-login" type="button">
                <svg class="messenger-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.7 3.4 18.5 19c-.2 1.1-.9 1.4-1.8.9l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9-8.1c.4-.4-.1-.6-.6-.2L6 12.8l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.2 2.6c.9-.3 1.7.2 1.5.8Z"/>
                </svg>
                <span>Войти через Telegram</span>
            </button>
        </div>
        <div class="login-flow telegram-flow" id="telegram-flow"></div>
        <div class="login-divider">или</div>
        <button class="messenger-button max-button" id="max-login" type="button">Войти через MAX</button>
        <div class="login-flow" id="max-flow"></div>
        
        <div class="footer-text">
            Нажимая кнопку, вы авторизуетесь через официальный сервис Telegram.
            <br>
            Возникли вопросы? <a href="https://t.me/{{ bot_username }}" target="_blank">Перейти к боту</a>
        </div>
    </div>

    <script>
    (() => {
        let activePoll = null;

        function connectLogin(platform, messengerName) {
            const button = document.getElementById(`${platform}-login`);
            const flow = document.getElementById(`${platform}-flow`);
            button.addEventListener('click', async () => {
                if (activePoll) clearInterval(activePoll);
                button.disabled = true;
                flow.style.display = 'block';
                flow.textContent = 'Создаём безопасную ссылку…';
                try {
                    const response = await fetch(`/api/auth/${platform}/start`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || 'Не удалось начать вход');

                    flow.replaceChildren();
                    const message = document.createElement('div');
                    message.textContent = `Откройте бота в ${messengerName} и нажмите «Старт». Если команда не подставилась, отправьте её вручную:`;
                    const code = document.createElement('span');
                    code.className = 'login-code';
                    code.textContent = data.command;
                    message.append(code);
                    flow.append(message);

                    if (data.deep_link) {
                        const link = document.createElement('a');
                        link.href = data.deep_link;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        link.textContent = `Открыть бота в ${messengerName}`;
                        flow.append(link);
                    }

                    activePoll = setInterval(async () => {
                        const status = await fetch(
                            `/api/auth/${platform}/status/${encodeURIComponent(data.token)}`,
                            {credentials: 'include'}
                        );
                        if (!status.ok) return;
                        const result = await status.json();
                        if (result.status === 'complete') {
                            clearInterval(activePoll);
                            location.replace(result.redirect);
                        }
                    }, 1800);
                } catch (error) {
                    flow.textContent = error.message;
                    button.disabled = false;
                }
            });
        }

        connectLogin('telegram', 'Telegram');
        connectLogin('max', 'MAX');
    })();
    </script>

</body>
</html>
