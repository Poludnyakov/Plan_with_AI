<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>планиИруй! — Вход в личный кабинет</title>
    <link rel="icon" type="image/png" href="/favicon.ico">
    <meta name="theme-color" content="#3478f6">
    <style>
        :root {
            --bg:#f3f5f9; --surface:#fff; --text:#182033; --muted:#5f6878; --line:#e4e8ef;
            --primary:#2563d9; --primary-soft:#e8f0ff; --telegram:#0b78b8; --max:#7448e6;
            --shadow:0 1px 2px #1118270d, 0 12px 32px #1f3a7a14;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
            background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:18px; padding:24px 16px; -webkit-font-smoothing:antialiased;
        }
        .home-link {
            display:inline-flex; align-items:center; gap:9px; color:var(--text); text-decoration:none;
            font-size:21px; font-weight:850; letter-spacing:-.02em;
        }
        .home-link img { width:32px; height:32px; }
        .login-card {
            position:relative; width:100%; max-width:430px; padding:84px 32px 28px; margin-top:64px;
            background:var(--surface); border-radius:24px; box-shadow:var(--shadow); text-align:center;
            animation:fadeIn .35s ease-out;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
        .mascot {
            position:absolute; left:50%; top:-74px; width:150px; height:150px; transform:translateX(-50%);
            filter:drop-shadow(0 14px 22px #1f3a7a2e);
        }
        h1 { font-size:24px; font-weight:820; letter-spacing:-.02em; margin-bottom:10px; }
        p { font-size:15px; color:var(--muted); line-height:1.55; margin-bottom:26px; }
        .widget-container { display:flex; justify-content:center; }
        .messenger-button {
            width:100%; min-height:52px; border:0; border-radius:15px; display:flex; align-items:center;
            justify-content:center; gap:10px; color:#fff; font:inherit; font-size:16px; font-weight:750;
            cursor:pointer; transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease;
        }
        .messenger-button:hover { transform:translateY(-1px); }
        .messenger-button:active { transform:none; }
        .messenger-button:disabled { opacity:.6; cursor:wait; transform:none; }
        .messenger-button:focus-visible, a:focus-visible { outline:3px solid #3478f680; outline-offset:3px; }
        .telegram-button { background:var(--telegram); box-shadow:0 8px 20px #0b78b840; }
        .max-button { background:var(--max); box-shadow:0 8px 20px #7448e638; }
        .messenger-icon { width:22px; height:22px; flex:0 0 auto; fill:currentColor; }
        .login-divider { display:flex; align-items:center; gap:12px; margin:16px 0; color:var(--muted); font-size:13px; }
        .login-divider::before,.login-divider::after { content:""; height:1px; flex:1; background:var(--line); }
        .login-flow { display:none; margin-top:14px; padding:13px; border-radius:14px; background:#f3efff; color:#3b2b68; font-size:14px; line-height:1.5; text-align:left; }
        .login-flow.telegram-flow { background:#eaf6fd; color:#1d5470; }
        .login-flow a { display:inline-block; margin-top:8px; color:#5b2fd0; font-weight:750; }
        .login-flow.telegram-flow a { color:#0f76a8; }
        .login-code { display:block; margin-top:6px; font:700 15px ui-monospace,monospace; letter-spacing:.4px; overflow-wrap:anywhere; }
        .footer-text { font-size:13px; color:var(--muted); margin-top:20px; line-height:1.5; }
        .footer-text a { color:var(--primary); font-weight:650; text-decoration:none; }
        .footer-text a:hover { text-decoration:underline; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#11151b; --surface:#191e26; --text:#eef1f6; --muted:#a9b0bd; --line:#303743; --primary:#7aa8ff; --shadow:0 1px 2px #0006, 0 12px 32px #0005; }
            .login-flow { background:#2a2440; color:#ddd3ff; } .login-flow a { color:#c1aaff; }
            .login-flow.telegram-flow { background:#17324a; color:#cfe9fb; } .login-flow.telegram-flow a { color:#8fd0ff; }
        }
        @media (max-width: 420px) { .login-card { padding:78px 20px 24px; } .mascot { width:132px; height:132px; top:-64px; } }
    </style>
</head>
<body>

    <a class="home-link" href="/" aria-label="планиИруй! — на главную"><img src="/websitephoto.png" alt="" width="32" height="32">планиИруй!</a>
    <main class="login-card">
        <img class="mascot" src="/static/brand/emoji/wave.webp" alt="" width="150" height="150">
        <h1>Вход в календарь</h1>
        <p>Войдите через мессенджер, в котором пользуетесь ботом, — откроется тот же календарь с событиями, расписанием и напоминаниями.</p>

        <div class="widget-container">
            <button class="messenger-button telegram-button" id="telegram-login" type="button">
                <svg class="messenger-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.7 3.4 18.5 19c-.2 1.1-.9 1.4-1.8.9l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9-8.1c.4-.4-.1-.6-.6-.2L6 12.8l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.2 2.6c.9-.3 1.7.2 1.5.8Z"/>
                </svg>
                <span>Войти через Telegram</span>
            </button>
        </div>
        <div class="login-flow telegram-flow" id="telegram-flow"></div>
        <div class="login-divider">или</div>
        <button class="messenger-button max-button" id="max-login" type="button">Войти через MAX</button>
        <div class="login-flow" id="max-flow"></div>
        
        <div class="footer-text">
            Вход подтверждается в самом боте — пароль не нужен.
            <br>
            Ещё не пользуетесь? <a href="https://t.me/{{ bot_username }}" target="_blank" rel="noopener">Открыть бота</a> · <a href="/">О сервисе</a>
        </div>
    </main>

    <script>
    (() => {
        let activePoll = null;

        function connectLogin(platform, messengerName) {
            const button = document.getElementById(`${platform}-login`);
            const flow = document.getElementById(`${platform}-flow`);
            button.addEventListener('click', async () => {
                if (activePoll) clearInterval(activePoll);
                button.disabled = true;
                flow.style.display = 'block';
                flow.textContent = 'Создаём безопасную ссылку…';
                try {
                    const response = await fetch(`/api/auth/${platform}/start`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || 'Не удалось начать вход');

                    flow.replaceChildren();
                    const message = document.createElement('div');
                    message.textContent = `Откройте бота в ${messengerName} и нажмите «Старт». Если команда не подставилась, отправьте её вручную:`;
                    const code = document.createElement('span');
                    code.className = 'login-code';
                    code.textContent = data.command;
                    message.append(code);
                    flow.append(message);

                    if (data.deep_link) {
                        const link = document.createElement('a');
                        link.href = data.deep_link;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        link.textContent = `Открыть бота в ${messengerName}`;
                        flow.append(link);
                    }

                    activePoll = setInterval(async () => {
                        const status = await fetch(
                            `/api/auth/${platform}/status/${encodeURIComponent(data.token)}`,
                            {credentials: 'include'}
                        );
                        if (!status.ok) return;
                        const result = await status.json();
                        if (result.status === 'complete') {
                            clearInterval(activePoll);
                            location.replace(result.redirect);
                        }
                    }, 1800);
                } catch (error) {
                    flow.textContent = error.message;
                    button.disabled = false;
                }
            });
        }

        connectLogin('telegram', 'Telegram');
        connectLogin('max', 'MAX');
    })();
    </script>

</body>
</html>
