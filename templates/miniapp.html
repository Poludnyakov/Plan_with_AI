<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>планиИруй!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            font-family: system-ui, sans-serif;
        }
        main { max-width: 420px; padding: 32px; text-align: center; }
        .spinner {
            width: 42px; height: 42px; margin: 0 auto 20px;
            border: 4px solid rgba(148, 163, 184, .25);
            border-top-color: #38bdf8; border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #error { color: var(--tg-theme-destructive-text-color, #f87171); }
    </style>
</head>
<body>
<main>
    <div class="spinner" id="spinner"></div>
    <p id="status">Проверяем аккаунт Telegram…</p>
    <p id="error" hidden></p>
</main>
<script>
    const destination = {{ destination | tojson }};
    const telegram = window.Telegram && window.Telegram.WebApp;
    const statusNode = document.getElementById('status');
    const errorNode = document.getElementById('error');
    const spinnerNode = document.getElementById('spinner');

    function showError(message) {
        spinnerNode.hidden = true;
        statusNode.hidden = true;
        errorNode.hidden = false;
        errorNode.textContent = message;
    }

    async function authenticate() {
        if (!telegram || !telegram.initData) {
            showError('Откройте календарь кнопкой Mini App внутри бота.');
            return;
        }
        telegram.ready();
        telegram.expand();
        try {
            const response = await fetch('/api/auth/miniapp', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({init_data: telegram.initData, destination})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || 'Ошибка авторизации');
            if (data.access_token) {
                try { sessionStorage.setItem('planiruy_access_token', data.access_token); } catch (_) {}
            }
            window.location.replace(data.redirect);
        } catch (error) {
            showError(error.message || 'Не удалось проверить аккаунт Telegram.');
        }
    }
    authenticate();
</script>
</body>
</html>
