events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Basic Settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Logging Configuration
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 1. HTTP Server — Permanent Redirect to HTTPS & ACME challenge validation path
    server {
        listen 80;
        server_name planwithai.ru www.planwithai.ru;

        # Direct path mapping for Let's Encrypt ACME challenge handshakes
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other standard HTTP traffic permanently to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server — Secure Gateway with Modern TLS Settings
    server {
        listen 443 ssl;
        server_name planwithai.ru www.planwithai.ru;

        # SSL Certificates populated dynamically by Certbot
        ssl_certificate /etc/letsencrypt/live/planwithai.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/planwithai.ru/privkey.pem;

        # Modern highly-secure SSL parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        
        # Session Optimization
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Premium reverse-proxy header mapping to preserve original user context
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Root fallback — routes all generic traffic to the FastAPI app container
        location / {
            proxy_pass http://app:8000;
        }

        # Explicit location block for API routing
        location /api/ {
            proxy_pass http://app:8000;
        }

        # Explicit location block for Visual Calendar routing
        location /calendar/ {
            proxy_pass http://app:8000;
        }

        # Explicit location block for Schedule Dashboard routing
        location /dashboard/ {
            proxy_pass http://app:8000;
        }
    }
}
