services:
  max_app:
    build: .
    container_name: planiruy_max
    restart: always
    command: uvicorn max_bot.app:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - MAX_BOT_USERNAME=${MAX_BOT_USERNAME:-}
      - MAX_WEBHOOK_SECRET=${MAX_WEBHOOK_SECRET}
      - MAX_PUBLIC_BASE_URL=${MAX_PUBLIC_BASE_URL:-https://planwithai.ru}
      - MAX_MINIAPP_NAME=${MAX_MINIAPP_NAME:-}
      - MAX_API_BASE_URL=${MAX_API_BASE_URL:-https://platform-api2.max.ru}
      - MAX_AUTO_REGISTER_WEBHOOK=${MAX_AUTO_REGISTER_WEBHOOK:-true}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - FOLDER_IR=${FOLDER_IR}
      - YANDEX_CLOUD_MODEL=${YANDEX_CLOUD_MODEL}
      - YANDEX_DOCUMENT_MODEL=${YANDEX_DOCUMENT_MODEL:-yandexgpt-lite/latest}
      - YANDEX_DOCUMENT_READER_MODEL=${YANDEX_DOCUMENT_READER_MODEL:-qwen3.6-35b-a3b/latest}
      - YANDEX_DOCUMENT_NORMALIZER_MODEL=${YANDEX_DOCUMENT_NORMALIZER_MODEL:-yandexgpt-lite/latest}
      - YANDEX_DOCUMENT_OCR_MODEL=${YANDEX_DOCUMENT_OCR_MODEL:-table}
      - YANDEX_EMAIL=${YANDEX_EMAIL}
      - YANDEX_APP_PASSWORD=${YANDEX_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/max/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
