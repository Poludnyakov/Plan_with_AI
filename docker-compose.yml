services:
  db:
    image: postgres:15-alpine
    container_name: planiruy_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: planiruy_web
    restart: always
    command: uvicorn app_intervals:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - FOLDER_IR=${FOLDER_IR}
      - YANDEX_CLOUD_MODEL=${YANDEX_CLOUD_MODEL}
      - YANDEX_DOCUMENT_MODEL=${YANDEX_DOCUMENT_MODEL:-yandexgpt-lite/latest}
      - YANDEX_DOCUMENT_READER_MODEL=${YANDEX_DOCUMENT_READER_MODEL:-qwen3.6-35b-a3b/latest}
      - YANDEX_DOCUMENT_NORMALIZER_MODEL=${YANDEX_DOCUMENT_NORMALIZER_MODEL:-yandexgpt-lite/latest}
      - YANDEX_DOCUMENT_OCR_MODEL=${YANDEX_DOCUMENT_OCR_MODEL:-table}
      - YANDEX_DOCUMENT_MAX_READER_FRAGMENTS=${YANDEX_DOCUMENT_MAX_READER_FRAGMENTS:-4}
      - APP_URL=${APP_URL}
      - YANDEX_EMAIL=${YANDEX_EMAIL}
      - YANDEX_APP_PASSWORD=${YANDEX_APP_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID}
      - MAX_BOT_USERNAME=${MAX_BOT_USERNAME:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build: .
    container_name: planiruy_bot
    restart: always
    command: python bot_main_intervals.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - FOLDER_IR=${FOLDER_IR}
      - YANDEX_CLOUD_MODEL=${YANDEX_CLOUD_MODEL}
      - YANDEX_DOCUMENT_MODEL=${YANDEX_DOCUMENT_MODEL:-yandexgpt-lite/latest}
      - YANDEX_DOCUMENT_READER_MODEL=${YANDEX_DOCUMENT_READER_MODEL:-qwen3.6-35b-a3b/latest}
      - YANDEX_DOCUMENT_NORMALIZER_MODEL=${YANDEX_DOCUMENT_NORMALIZER_MODEL:-yandexgpt-lite/latest}
      - YANDEX_DOCUMENT_OCR_MODEL=${YANDEX_DOCUMENT_OCR_MODEL:-table}
      - YANDEX_DOCUMENT_MAX_READER_FRAGMENTS=${YANDEX_DOCUMENT_MAX_READER_FRAGMENTS:-4}
      - APP_URL=${APP_URL}
      - YANDEX_EMAIL=${YANDEX_EMAIL}
      - YANDEX_APP_PASSWORD=${YANDEX_APP_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: planiruy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: planiruy_certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit 0 SIGTERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
